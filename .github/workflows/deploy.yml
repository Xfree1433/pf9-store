name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      # The Pages artifact is the whole checkout (path: '.'), and this repo is
      # public — anything left here is served at store.plainspokenfoundrynine.com.
      - name: Strip internal files from the published site
        run: |
          set -eux
          # NB: templates/ is public — the lead-magnet emails link to it.
          rm -rf node_modules tests src __pycache__ .github
          find . -name '*.md' -delete
          find . -name '*.py' -delete
          find . -name '*.sh' -delete
          rm -f package.json package-lock.json tailwind.config.js .gitignore
          test -f index.html && test -f dist/tailwind.css
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
